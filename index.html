<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7fbfc" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>memo-flick</title>
  <style>
    :root{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:#f7fbfc;color:#203740}*{box-sizing:border-box}body{margin:0}.shell{position:relative;width:min(100%,480px);margin:auto;padding: max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));overflow-x:clip}#composer-host{position:relative;z-index:3;padding:12px;border:1px solid #fff;border-radius:24px;background:rgba(255,255,255,.8);box-shadow:0 14px 45px #729ba026;backdrop-filter:blur(22px) saturate(1.3)}#composer-form{display:flex;align-items:end;gap:10px}#quick-memo{display:block;flex:1;min-width:0;min-height:62px;max-height:200px;resize:vertical;border:0;outline:0;background:transparent;font:inherit;font-size:17px;line-height:1.5;color:#203740;padding:8px}#quick-memo::placeholder{color:#8a9b9f}#quick-memo:focus-visible{outline:2px solid #7bc7c8;border-radius:12px}#quick-add{border:0;border-radius:16px;background:#257f87;color:#fff;min-width:60px;min-height:44px;font:inherit;font-weight:700;cursor:pointer}#skeleton{padding-top:22px;min-height:calc(100svh - 120px);transition:opacity .24s}.sk-head,.sk-tab,.sk-card{background:linear-gradient(105deg,#e5eef0 20%,#f9ffff 40%,#e5eef0 60%);background-size:200% 100%;animation:shimmer 1.5s linear infinite;border-radius:18px}.sk-head{height:42px;width:46%;margin-bottom:24px}.sk-tabs{display:flex;gap:8px;margin-bottom:22px}.sk-tab{height:48px;flex:1}.sk-card{height:110px;margin:12px 0}#root{opacity:0;transition:opacity .3s}#root.ready{opacity:1}#skeleton.gone{opacity:0;pointer-events:none;position:absolute;width:calc(100% - 32px)}@keyframes shimmer{to{background-position-x:-200%}}@media(prefers-reduced-motion:reduce){.sk-head,.sk-tab,.sk-card{animation:none}#root,#skeleton{transition:none}}
  </style>
</head>
<body>
  <div class="shell">
    <div id="composer-host"><form id="composer-form"><textarea id="quick-memo" autofocus maxlength="2000" placeholder="メモを入力" aria-label="メモを入力"></textarea><button id="quick-add" type="submit" aria-label="メモを追加">追加</button></form></div>
    <div id="skeleton" aria-label="読み込み中"><div class="sk-head"></div><div class="sk-tabs"><div class="sk-tab"></div><div class="sk-tab"></div><div class="sk-tab"></div><div class="sk-tab"></div></div><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div></div>
    <div id="root"></div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
